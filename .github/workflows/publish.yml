name: Publish

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: check
        run: |
          set -euo pipefail
          mkdir -p /tmp/jsr-meta
          for pkg in core themes vite create solid; do
            curl -fsSL "https://jsr.io/@speechdeck/${pkg}/meta.json" -o "/tmp/jsr-meta/${pkg}.json" || echo '{}' > "/tmp/jsr-meta/${pkg}.json"
          done
          node scripts/should-publish.ts --meta-dir /tmp/jsr-meta
      - run: pnpm publish:jsr
        if: steps.check.outputs.shouldPublish == 'true'
